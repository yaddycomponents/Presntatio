  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

iv style=\"display:flex; flex-direction:column; align-items:center; text-align:center; gap:30px; padding:0 140px;\">\n      <div style=\"font-size:26px; letter-spacing:0.42em; text-transform:uppercase; font-weight:500; padding-left:0.42em;\">A Sprint Demo in One Act<\u002Fdiv>\n      <div style=\"width:120px; height:1px; background:#f6ead9; opacity:0.7;\"><\u002Fdiv>\n      <h1 style=\"font-family:'Yeseva One',serif; font-size:128px; line-height:0.98; margin:0; font-weight:400;\">Dashboard Load<br>Performance<\u002Fh1>\n      <div style=\"font-size:38px; font-weight:300; letter-spacing:0.04em; font-style:italic;\">Production &nbsp;·&nbsp; vs. &nbsp;·&nbsp; The New Bundle<\u002Fdiv>\n      <div style=\"display:flex; gap:54px; align-items:center; margin-top:26px; font-family:'Space Mono',monospace; font-size:21px; letter-spacing:0.08em;\">\n        <span>13 JUNE 2026<\u002Fspan>\n        <span style=\"opacity:0.6;\">◆<\u002Fspan>\n        <span>/dashboard/company<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ═══════════════ SLIDE 2 — HEADLINE NUMBERS ═══════════════ -->\n  <section data-label=\"Headline Numbers\" data-speaker-notes=\"The five rows that matter. Bytes transferred down ~5x. Time to interactive 2.6x faster. JavaScript shipped 2.2x less. API calls on load more than halved.\" style=\"background:#f4e7d6; font-family:'Josefin Sans',sans-serif; color:#5e3b46; display:flex; align-items:center; justify-content:center; overflow:hidden;\">\n    <div style=\"position:absolute; inset:46px; border:3px solid #6b4a55;\"><\u002Fdiv>\n    <div style=\"position:absolute; inset:58px; border:1px solid #6b4a55;\"><\u002Fdiv>\n\n    <div style=\"width:100%; max-width:1480px; padding:0 120px; display:flex; flex-direction:column; align-items:center;\">\n      <div style=\"text-align:center; margin-bottom:18px;\">\n        <div style=\"font-size:24px; letter-spacing:0.4em; text-transform:uppercase; color:#a86e7c; padding-left:0.4em;\">Chapter One<\u002Fdiv>\n        <h2 style=\"font-family:'Yeseva One',serif; font-size:74px; margin:14px 0 0; font-weight:400;\">The Headline Numbers<\u002Fh2>\n      <\u002Fdiv>\n\n      <!-- ledger header -->\n      <div style=\"width:100%; display:grid; grid-template-columns:1.7fr 1fr 1fr 1fr; align-items:end; padding:0 14px 14px; border-bottom:2px solid #6b4a55; font-family:'Space Mono',monospace; font-size:21px; letter-spacing:0.06em; text-transform:uppercase; color:#8a6470;\">\n        <div>Metric<\u002Fdiv>\n        <div style=\"text-align:center;\">Production<\u002Fdiv>\n        <div style=\"text-align:center; color:#5b7d77;\">New Bundle<\u002Fdiv>\n        <div style=\"text-align:center;\">Improvement<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- rows -->\n      <div style=\"width:100%; display:grid; grid-template-columns:1.7fr 1fr 1fr 1fr; align-items:center; padding:24px 14px; border-bottom:1px solid #d8b9ab; font-size:30px;\">\n        <div style=\"font-weight:600;\">Bytes transferred<\u002Fdiv>\n        <div style=\"text-align:center; font-family:'Yeseva One',serif; font-size:40px;\">13.2 MB<\u002Fdiv>\n        <div style=\"text-align:center; font-family:'Yeseva One',serif; font-size:40px; color:#5b7d77;\">2.6 MB<\u002Fdiv>\n        <div style=\"text-align:center; font-weight:600; color:#a8536a;\">~5× less<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:100%; display:grid; grid-template-columns:1.7fr 1fr 1fr 1fr; align-items:center; padding:24px 14px; border-bottom:1px solid #d8b9ab; font-size:30px;\">\n        <div style=\"font-weight:600;\">Time to interactive <span style=\"font-size:21px; color:#a86e7c;\">(DOMContentLoaded)<\u002Fspan><\u002Fdiv>\n        <div style=\"text-align:center; font-family:'Yeseva One',serif; font-size:40px;\">865 ms<\u002Fdiv>\n        <div style=\"text-align:center; font-family:'Yeseva One',serif; font-size:40px; color:#5b7d77;\">333 ms<\u002Fdiv>\n        <div style=\"text-align:center; font-weight:600; color:#a8536a;\">2.6× faster<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:100%; display:grid; grid-template-columns:1.7fr 1fr 1fr 1fr; align-items:center; padding:24px 14px; border-bottom:1px solid #d8b9ab; font-size:30px;\">\n        <div style=\"font-weight:600;\">Page <span style=\"font-family:'Space Mono',monospace; font-size:24px;\">load<\u002Fspan><\u002Fdiv>\n        <div style=\"text-align:center; font-family:'Yeseva One',serif; font-size:40px;\">1.87 s<\u002Fdiv>\n        <div style=\"text-align:center; font-family:'Yeseva One',serif; font-size:40px; color:#5b7d77;\">1.22 s<\u002Fdiv>\n        <div style=\"text-align:center; font-weight:600; color:#a8536a;\">1.5× faster<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:100%; display:grid; grid-template-columns:1.7fr 1fr 1fr 1fr; align-items:center; padding:24px 14px; border-bottom:1px solid #d8b9ab; font-size:30px;\">\n        <div style=\"font-weight:600;\">JavaScript shipped <span style=\"font-size:21px; color:#a86e7c;\">(uncompressed)<\u002Fspan><\u002Fdiv>\n        <div style=\"text-align:center; font-family:'Yeseva One',serif; font-size:40px;\">19.9 MB<\u002Fdiv>\n        <div style=\"text-align:center; font-family:'Yeseva One',serif; font-size:40px; color:#5b7d77;\">9.0 MB<\u002Fdiv>\n        <div style=\"text-align:center; font-weight:600; color:#a8536a;\">2.2× less<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:100%; display:grid; grid-template-columns:1.7fr 1fr 1fr 1fr; align-items:center; padding:24px 14px; font-size:30px;\">\n        <div style=\"font-weight:600;\">XHR calls on load<\u002Fdiv>\n        <div style=\"text-align:center; font-family:'Yeseva One',serif; font-size:40px;\">48<\u002Fdiv>\n        <div style=\"text-align:center; font-family:'Yeseva One',serif; font-size:40px; color:#5b7d77;\">21<\u002Fdiv>\n        <div style=\"text-align:center; font-weight:600; color:#a8536a;\">~2.3× fewer<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ═══════════════ SLIDE 3 — WHERE THE BYTES WENT (CHARTS) ═══════════════ -->\n  <section data-label=\"Where the Bytes Went\" data-speaker-notes=\"Same story in three pairs. For each metric the tall bar is production, the short sage bar is the new bundle. Bytes over the wire fall from 13.2 to 2.6 megabytes; JavaScript from 19.9 to 9; XHR calls from 48 to 21.\" style=\"background:#f4e7d6; font-family:'Josefin Sans',sans-serif; color:#5e3b46; display:flex; align-items:center; justify-content:center; overflow:hidden;\">\n    <div style=\"position:absolute; inset:46px; border:3px solid #6b4a55;\"><\u002Fdiv>\n    <div style=\"position:absolute; inset:58px; border:1px solid #6b4a55;\"><\u002Fdiv>\n\n    <div style=\"width:100%; max-width:1560px; padding:0 130px; display:flex; flex-direction:column; align-items:center;\">\n      <div style=\"text-align:center; margin-bottom:54px;\">\n        <div style=\"font-size:24px; letter-spacing:0.4em; text-transform:uppercase; color:#a86e7c; padding-left:0.4em;\">Chapter Two<\u002Fdiv>\n        <h2 style=\"font-family:'Yeseva One',serif; font-size:74px; margin:14px 0 0; font-weight:400;\">Where the Bytes Went<\u002Fh2>\n      <\u002Fdiv>\n\n      <!-- three chart groups -->\n      <div style=\"display:flex; justify-content:center; gap:120px; align-items:flex-end;\">\n\n        <!-- group: bytes transferred -->\n        <div style=\"display:flex; flex-direction:column; align-items:center; gap:26px;\">\n          <div style=\"display:flex; align-items:flex-end; gap:36px; height:360px;\">\n            <div style=\"display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:14px;\">\n              <div style=\"font-family:'Yeseva One',serif; font-size:32px;\">13.2<\u002Fdiv>\n              <div style=\"width:88px; height:340px; background:#c97a8a; border:1px solid #6b4a55;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:14px;\">\n              <div style=\"font-family:'Yeseva One',serif; font-size:32px; color:#5b7d77;\">2.6<\u002Fdiv>\n              <div style=\"width:88px; height:67px; background:#8aa9a6; border:1px solid #6b4a55;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center;\">\n            <div style=\"font-weight:600; font-size:26px;\">Bytes Transferred<\u002Fdiv>\n            <div style=\"font-family:'Space Mono',monospace; font-size:18px; color:#a86e7c; letter-spacing:0.04em;\">megabytes · over the wire<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- group: JS shipped -->\n        <div style=\"display:flex; flex-direction:column; align-items:center; gap:26px;\">\n          <div style=\"display:flex; align-items:flex-end; gap:36px; height:360px;\">\n            <div style=\"display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:14px;\">\n              <div style=\"font-family:'Yeseva One',serif; font-size:32px;\">19.9<\u002Fdiv>\n              <div style=\"width:88px; height:340px; background:#c97a8a; border:1px solid #6b4a55;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:14px;\">\n              <div style=\"font-family:'Yeseva One',serif; font-size:32px; color:#5b7d77;\">9.0<\u002Fdiv>\n              <div style=\"width:88px; height:154px; background:#8aa9a6; border:1px solid #6b4a55;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center;\">\n            <div style=\"font-weight:600; font-size:26px;\">JavaScript Shipped<\u002Fdiv>\n            <div style=\"font-family:'Space Mono',monospace; font-size:18px; color:#a86e7c; letter-spacing:0.04em;\">megabytes · uncompressed<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- group: XHR calls -->\n        <div style=\"display:flex; flex-direction:column; align-items:center; gap:26px;\">\n          <div style=\"display:flex; align-items:flex-end; gap:36px; height:360px;\">\n            <div style=\"display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:14px;\">\n              <div style=\"font-family:'Yeseva One',serif; font-size:32px;\">48<\u002Fdiv>\n              <div style=\"width:88px; height:340px; background:#c97a8a; border:1px solid #6b4a55;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:14px;\">\n              <div style=\"font-family:'Yeseva One',serif; font-size:32px; color:#5b7d77;\">21<\u002Fdiv>\n              <div style=\"width:88px; height:149px; background:#8aa9a6; border:1px solid #6b4a55;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center;\">\n            <div style=\"font-weight:600; font-size:26px;\">XHR Calls on Load<\u002Fdiv>\n            <div style=\"font-family:'Space Mono',monospace; font-size:18px; color:#a86e7c; letter-spacing:0.04em;\">requests · critical path<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <!-- legend -->\n      <div style=\"display:flex; gap:48px; margin-top:54px; font-size:23px; letter-spacing:0.04em;\">\n        <div style=\"display:flex; align-items:center; gap:12px;\"><span style=\"width:22px; height:22px; background:#c97a8a; border:1px solid #6b4a55; display:inline-block;\"><\u002Fspan> Production<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:12px;\"><span style=\"width:22px; height:22px; background:#8aa9a6; border:1px solid #6b4a55; display:inline-block;\"><\u002Fspan> New Bundle<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ═══════════════ SLIDE 4 — WIN ONE: BUNDLE ARCHITECTURE ═══════════════ -->\n  <section data-label=\"Win One — Bundle\" data-speaker-notes=\"First initiative: bundle architecture. Production ships one near-monolith — everything loads whether the screen needs it or not. The new bundle code-splits by route and feature, and isolates heavy stable libraries into cache-stable chunks. 13 megabytes of JS over the wire becomes 2.6.\" style=\"background:#f4e7d6; font-family:'Josefin Sans',sans-serif; color:#5e3b46; display:flex; align-items:center; justify-content:center; overflow:hidden;\">\n    <div style=\"position:absolute; inset:46px; border:3px solid #6b4a55;\"><\u002Fdiv>\n    <div style=\"position:absolute; inset:58px; border:1px solid #6b4a55;\"><\u002Fdiv>\n\n    <div style=\"width:100%; max-width:1560px; padding:0 130px; display:flex; flex-direction:column; align-items:center;\">\n      <div style=\"text-align:center; margin-bottom:50px;\">\n        <div style=\"font-size:24px; letter-spacing:0.4em; text-transform:uppercase; color:#a86e7c; padding-left:0.4em;\">Win One<\u002Fdiv>\n        <h2 style=\"font-family:'Yeseva One',serif; font-size:74px; margin:14px 0 0; font-weight:400;\">Monolith → Code-Split<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; align-items:center; justify-content:center; gap:80px; width:100%;\">\n        <!-- monolith -->\n        <div style=\"display:flex; flex-direction:column; align-items:center; gap:24px;\">\n          <div style=\"width:300px; height:300px; background:#c97a8a; border:2px solid #6b4a55; display:flex; align-items:center; justify-content:center; text-align:center; color:#f6ead9; font-family:'Space Mono',monospace; font-size:20px; line-height:1.6; letter-spacing:0.04em;\">vendor-*.js<br>index-*.js<br><span style=\"font-size:15px; opacity:0.85;\">everything,<br>eager<\u002Fspan><\u002Fdiv>\n          <div style=\"font-weight:600; font-size:25px;\">Production · 18 files<\u002Fdiv>\n          <div style=\"font-family:'Yeseva One',serif; font-size:46px; color:#a8536a;\">13 MB<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- arrow -->\n        <div style=\"display:flex; flex-direction:column; align-items:center; gap:10px; color:#8a6470;\">\n          <div style=\"font-size:64px; line-height:1;\">→<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- code-split grid -->\n        <div style=\"display:flex; flex-direction:column; align-items:center; gap:24px;\">\n          <div style=\"width:300px; height:300px; display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(5,1fr); gap:8px;\">\n            <div style=\"background:#8aa9a6; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#e8b9a0; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#8aa9a6; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#cdd8c4; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#e8b9a0; border:1px solid #6b4a55;\"><\u002Fdiv>\n            <div style=\"background:#e8b9a0; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#8aa9a6; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#cdd8c4; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#8aa9a6; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#cdd8c4; border:1px solid #6b4a55;\"><\u002Fdiv>\n            <div style=\"background:#cdd8c4; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#e8b9a0; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#8aa9a6; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#e8b9a0; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#8aa9a6; border:1px solid #6b4a55;\"><\u002Fdiv>\n            <div style=\"background:#8aa9a6; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#cdd8c4; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#e8b9a0; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#8aa9a6; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#e8b9a0; border:1px solid #6b4a55;\"><\u002Fdiv>\n            <div style=\"background:#e8b9a0; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#8aa9a6; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#cdd8c4; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#e8b9a0; border:1px solid #6b4a55;\"><\u002Fdiv><div style=\"background:#8aa9a6; border:1px solid #6b4a55;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-weight:600; font-size:25px;\">New Bundle · 55 chunks<\u002Fdiv>\n          <div style=\"font-family:'Yeseva One',serif; font-size:46px; color:#5b7d77;\">2.6 MB<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; gap:64px; margin-top:50px; max-width:1280px; text-align:center; font-size:25px; line-height:1.5;\">\n        <div style=\"flex:1;\"><span style=\"font-weight:700; color:#a8536a;\">Split by route &amp; feature.<\u002Fspan><br><span style=\"color:#8a6470;\">GrowChart, TableModal, CustomerSearch load with the panel that mounts them.<\u002Fspan><\u002Fdiv>\n        <div style=\"flex:1;\"><span style=\"font-weight:700; color:#a8536a;\">Stable libs isolated.<\u002Fspan><br><span style=\"color:#8a6470;\">antd, ag-grid, rte in cache-stable chunks — deploys re-download only small app-*.js.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ═══════════════ SLIDE 5 — WIN TWO: DATA FETCHING ═══════════════ -->\n  <section data-label=\"Win Two — Data\" data-speaker-notes=\"Second initiative: data fetching. Production fires the full reference-data waterfall on boot — none of it needed to render the dashboard tiles; it feeds the inbox, filters and activity forms. The new bundle defers each call to point-of-use via React Query, deduped by a canonical key. That is the 48-to-21 drop.\" style=\"background:#8aa9a6; font-family:'Josefin Sans',sans-serif; color:#f6ead9; display:flex; align-items:center; justify-content:center; overflow:hidden;\">\n    <div style=\"position:absolute; inset:46px; border:3px solid #f6ead9;\"><\u002Fdiv>\n    <div style=\"position:absolute; inset:58px; border:1px solid #f6ead9;\"><\u002Fdiv>\n\n    <div style=\"width:100%; max-width:1540px; padding:0 130px; display:flex; flex-direction:column; align-items:center;\">\n      <div style=\"text-align:center; margin-bottom:46px;\">\n        <div style=\"font-size:24px; letter-spacing:0.4em; text-transform:uppercase; opacity:0.85; padding-left:0.4em;\">Win Two<\u002Fdiv>\n        <h2 style=\"font-family:'Yeseva One',serif; font-size:74px; margin:14px 0 0; font-weight:400;\">Eager Boot → Point-of-Use<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; align-items:stretch; justify-content:center; gap:60px; width:100%;\">\n        <!-- before: waterfall -->\n        <div style=\"flex:1; max-width:620px; background:#7a9a96; border:1px solid #f6ead9; padding:32px 36px;\">\n          <div style=\"font-weight:600; font-size:24px; letter-spacing:0.04em; margin-bottom:6px;\">PRODUCTION · BOOT WATERFALL<\u002Fdiv>\n          <div style=\"font-family:'Yeseva One',serif; font-size:54px; margin-bottom:18px;\">48 calls<\u002Fdiv>\n          <div style=\"font-family:'Space Mono',monospace; font-size:18.5px; line-height:1.95; opacity:0.95;\">\n            invoice-statuses<br>\n            collection-statuses<br>\n            invoice-dispute-types<br>\n            invoice-followup-statuses<br>\n            invoice-followup-activities<br>\n            aging-data<br>\n            high-risk-customers&nbsp;&nbsp;<span style=\"opacity:0.7;\">…<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; align-items:center; font-size:60px;\">→<\u002Fdiv>\n\n        <!-- after: deferred -->\n        <div style=\"flex:1; max-width:620px; background:#9bb8b4; border:1px solid #f6ead9; padding:32px 36px; display:flex; flex-direction:column;\">\n          <div style=\"font-weight:600; font-size:24px; letter-spacing:0.04em; margin-bottom:6px;\">NEW BUNDLE · DEFERRED<\u002Fdiv>\n          <div style=\"font-family:'Yeseva One',serif; font-size:54px; margin-bottom:18px;\">21 calls<\u002Fdiv>\n          <div style=\"font-size:25px; line-height:1.6;\">Reference data is fetched <span style=\"font-weight:700;\">when the feature that needs it opens<\u002Fspan> — the inbox, a filter, an activity form — not on the dashboard shell.<\u002Fdiv>\n          <div style=\"margin-top:auto; padding-top:22px; font-family:'Space Mono',monospace; font-size:18px; opacity:0.9;\">React Query · deduped by canonical key<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:42px; font-size:27px; letter-spacing:0.03em;\">None of the deferred calls render a single dashboard tile.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ═══════════════ SLIDE 6 — MORE REQUESTS, FEWER BYTES ═══════════════ -->\n  <section data-label=\"More Requests, Fewer Bytes\" data-speaker-notes=\"Anticipate the objection. The new bundle makes more HTTP requests — 95 versus 73 — but transfers a fifth of the bytes. Over HTTP/2 multiplexing, requests are cheap and bytes are expensive. The proof is interactivity: DOMContentLoaded 333 milliseconds versus 865.\" style=\"background:#f4e7d6; font-family:'Josefin Sans',sans-serif; color:#5e3b46; display:flex; align-items:center; justify-content:center; overflow:hidden;\">\n    <div style=\"position:absolute; inset:46px; border:3px solid #6b4a55;\"><\u002Fdiv>\n    <div style=\"position:absolute; inset:58px; border:1px solid #6b4a55;\"><\u002Fdiv>\n\n    <div style=\"width:100%; max-width:1480px; padding:0 130px; display:flex; flex-direction:column; align-items:center; text-align:center;\">\n      <div style=\"font-size:24px; letter-spacing:0.4em; text-transform:uppercase; color:#a86e7c; padding-left:0.4em; margin-bottom:14px;\">An Anticipated Objection<\u002Fdiv>\n      <h2 style=\"font-family:'Yeseva One',serif; font-size:70px; margin:0 0 50px; font-weight:400;\">More Requests, Fewer Bytes<\u002Fh2>\n\n      <div style=\"display:flex; align-items:center; justify-content:center; gap:90px; margin-bottom:54px;\">\n        <div>\n          <div style=\"font-family:'Yeseva One',serif; font-size:96px; line-height:1; color:#a8536a;\">95 <span style=\"font-size:42px; color:#8a6470;\">vs 73<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:24px; margin-top:10px; color:#8a6470;\">HTTP requests &nbsp;—&nbsp; <span style=\"font-weight:600; color:#5e3b46;\">more, and that is fine<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:1px; height:130px; background:#d8b9ab;\"><\u002Fdiv>\n        <div>\n          <div style=\"font-family:'Yeseva One',serif; font-size:96px; line-height:1; color:#5b7d77;\">⅕ <span style=\"font-size:42px; color:#8a6470;\">the bytes<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:24px; margin-top:10px; color:#8a6470;\">network + parse + execute &nbsp;—&nbsp; <span style=\"font-weight:600; color:#5e3b46;\">where time goes<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"max-width:1150px; font-size:31px; line-height:1.55;\">Over HTTP/2 multiplexing, <span style=\"font-weight:700;\">requests are cheap; bytes are expensive.<\u002Fspan> Trading ~20 small cacheable requests for ~10 MB fewer bytes is the correct trade.<\u002Fdiv>\n\n      <div style=\"margin-top:46px; padding:22px 48px; border:2px solid #6b4a55; font-family:'Space Mono',monospace; font-size:26px; letter-spacing:0.04em;\">DOMContentLoaded &nbsp;·&nbsp; <span style=\"color:#a8536a; font-weight:700;\">333 ms<\u002Fspan> &nbsp;vs&nbsp; <span style=\"color:#8a6470;\">865 ms<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ═══════════════ SLIDE 7 — HONEST CAVEATS ═══════════════ -->\n  <section data-label=\"Honest Caveats\" data-speaker-notes=\"The credibility slide. Different deployments and slightly different data, so treat as order-of-magnitude, not a lab benchmark. Cache was disabled, so these are first-visit costs. Finish time is inflated on prod by non-blocking analytics — quote DOMContentLoaded instead. And always cite transferred bytes, not uncompressed size — antd is 2.57 raw but 0.8 gzipped.\" style=\"background:#f4e7d6; font-family:'Josefin Sans',sans-serif; color:#5e3b46; display:flex; align-items:center; justify-content:center; overflow:hidden;\">\n    <div style=\"position:absolute; inset:46px; border:3px solid #6b4a55;\"><\u002Fdiv>\n    <div style=\"position:absolute; inset:58px; border:1px solid #6b4a55;\"><\u002Fdiv>\n\n    <div style=\"width:100%; max-width:1500px; padding:0 130px; display:flex; flex-direction:column; align-items:center;\">\n      <div style=\"text-align:center; margin-bottom:48px;\">\n        <div style=\"font-size:24px; letter-spacing:0.4em; text-transform:uppercase; color:#a86e7c; padding-left:0.4em;\">Stated Plainly<\u002Fdiv>\n        <h2 style=\"font-family:'Yeseva One',serif; font-size:74px; margin:14px 0 0; font-weight:400;\">Honest Caveats<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:36px 70px; width:100%;\">\n        <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n          <div style=\"font-family:'Yeseva One',serif; font-size:46px; color:#c97a8a; line-height:1;\">i.<\u002Fdiv>\n          <div style=\"font-size:26px; line-height:1.5;\"><span style=\"font-weight:700;\">Different deployments &amp; data.<\u002Fspan> cash-king vs account-receivables, ~828 vs ~902 customers. Order-of-magnitude, not a lab benchmark — the deltas are large enough to be unambiguous.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n          <div style=\"font-family:'Yeseva One',serif; font-size:46px; color:#c97a8a; line-height:1;\">ii.<\u002Fdiv>\n          <div style=\"font-size:26px; line-height:1.5;\"><span style=\"font-weight:700;\">Cache disabled during capture.<\u002Fspan> These are first-visit costs. Repeat visits favor the new bundle even more — its stable-hash chunks survive deploys.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n          <div style=\"font-family:'Yeseva One',serif; font-size:46px; color:#c97a8a; line-height:1;\">iii.<\u002Fdiv>\n          <div style=\"font-size:26px; line-height:1.5;\"><span style=\"font-weight:700;\">Ignore <span style=\"font-family:'Space Mono',monospace; font-size:22px;\">Finish<\u002Fspan> time.<\u002Fspan> Prod's 1.16 min is inflated by non-blocking analytics &amp; monitoring. Quote DOMContentLoaded for interactivity.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:24px; align-items:flex-start;\">\n          <div style=\"font-family:'Yeseva One',serif; font-size:46px; color:#c97a8a; line-height:1;\">iv.<\u002Fdiv>\n          <div style=\"font-size:26px; line-height:1.5;\"><span style=\"font-weight:700;\">Cite transferred, not size.<\u002Fspan> lib-antd is ~2.57 MB raw but ~0.8 MB gzipped over the wire. Uncompressed overstates the real cost ~3.5×.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ═══════════════ SLIDE 8 — THE COMPOUNDING ADVANTAGE (CLOSE) ═══════════════ -->\n  <section data-label=\"Close\" data-speaker-notes=\"Close on the compounding advantage. The first-visit numbers already win. In production the gap widens: stable-hash chunks survive deploys, while the prod monolith busts its cache on every release. The win compounds with every visit.\" style=\"background:#d98c9a; font-family:'Josefin Sans',sans-serif; color:#f6ead9; display:flex; align-items:center; justify-content:center; overflow:hidden;\">\n    <div style=\"position:absolute; inset:46px; border:3px solid #f6ead9;\"><\u002Fdiv>\n    <div style=\"position:absolute; inset:58px; border:1px solid #f6ead9;\"><\u002Fdiv>\n    <div style=\"position:absolute; top:38px; left:38px; width:18px; height:18px; background:#f6ead9; transform:rotate(45deg);\"><\u002Fdiv>\n    <div style=\"position:absolute; top:38px; right:38px; width:18px; height:18px; background:#f6ead9; transform:rotate(45deg);\"><\u002Fdiv>\n    <div style=\"position:absolute; bottom:38px; left:38px; width:18px; height:18px; background:#f6ead9; transform:rotate(45deg);\"><\u002Fdiv>\n    <div style=\"position:absolute; bottom:38px; right:38px; width:18px; height:18px; background:#f6ead9; transform:rotate(45deg);\"><\u002Fdiv>\n\n    <div style=\"display:flex; flex-direction:column; align-items:center; text-align:center; gap:34px; padding:0 160px;\">\n      <div style=\"font-size:25px; letter-spacing:0.42em; text-transform:uppercase; font-weight:500; padding-left:0.42em;\">In Closing<\u002Fdiv>\n      <div style=\"width:120px; height:1px; background:#f6ead9; opacity:0.7;\"><\u002Fdiv>\n      <h2 style=\"font-family:'Yeseva One',serif; font-size:88px; line-height:1.04; margin:0; font-weight:400;\">The Advantage<br>Compounds<\u002Fh2>\n      <div style=\"font-size:33px; line-height:1.5; font-weight:300; max-width:1080px;\">Stable-hash chunks survive deploys; the prod monolith busts its cache on every release. The first visit already wins — <span style=\"font-style:italic; font-weight:500;\">every visit after widens the gap.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:54px; align-items:center; margin-top:18px; font-family:'Space Mono',monospace; font-size:22px; letter-spacing:0.06em;\">\n        <span>2.6× FASTER<\u002Fspan>\n        <span style=\"opacity:0.6;\">◆<\u002Fspan>\n        <span>5× LIGHTER<\u002Fspan>\n        <span style=\"opacity:0.6;\">◆<\u002Fspan>\n        <span>HALF THE CALLS<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
